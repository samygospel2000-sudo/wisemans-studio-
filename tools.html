<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Tools V2</title><style>body{background:#000;color:#fff;font-family:sans-serif;padding:20px;margin:0}.box{max-width:500px;margin:auto}.card{background:#1a1a1a;padding:20px;border-radius:16px;border:1px solid #333}.btn{padding:10px;border-radius:10px;border:1px solid #444;background:#272727;color:#fff;width:100%}.btn.active{background:#facc15;color:#000;font-weight:bold}textarea{width:100%;padding:12px;background:#000;border:1px solid #555;border-radius:12px;color:#fff} .go{width:100%;margin-top:12px;padding:14px;background:#facc15;color:#000;font-weight:bold;border:none;border-radius:12px}</style></head><body><div class="box"><h1>AI Tools V2</h1><div class="card"><div style="display:flex;gap:8px;margin-bottom:12px"><button id="bSw" onclick="mode='sw';upd()" class="btn active">Kiswahili</button><button id="bEn" onclick="mode='en';upd()" class="btn">EN→SW</button></div><textarea id="txt" rows="3" placeholder="Andika hapa..."></textarea><button class="go" onclick="go()">Tengeneza</button><div id="st" style="text-align:center;color:#facc15;margin-top:10px"></div><div id="out" style="display:none;margin-top:12px;padding:12px;background:#000;border:1px solid #555;border-radius:12px;white-space:pre-wrap"></div></div></div><script>let mode='sw';function upd(){document.getElementById('bSw').className=mode=='sw'?'btn active':'btn';document.getElementById('bEn').className=mode=='en'?'btn active':'btn';}async function go(){let t=document.getElementById('txt').value.trim();if(!t)return alert('Andika!');let s=document.getElementById('st'),o=document.getElementById('out');if(mode=='en'){s.innerText='Inatafsiri...';try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=en|sw');let j=await r.json();if(j.responseData&&j.responseData.translatedText){t=j.responseData.translatedText;s.innerText='Imetafsiriwa: '+t}else{s.innerText='Tafsiri imefail - jaribu tena';return}}catch(e){s.innerText='Hakuna internet ya tafsiri';return}}else{s.innerText='';}o.innerText='🔥 '+t+' 🔥\n\n#WisemansStudio';o.style.display='block';}upd();</script></body></html>
