<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Tools - Wisemans</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white p-6"><div class="max-w-xl mx-auto"><h1 class="text-2xl font-bold">AI Tools - Face 1</h1><p class="text-gray-400 mb-6">Auto Swahili Caption</p><div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800"><textarea id="txt" placeholder="Andika: Mungu ni mwema..." class="w-full p-4 bg-black border border-zinc-700 rounded-xl h-28"></textarea><button onclick="gen()" class="w-full mt-4 bg-yellow-400 text-black font-bold py-4 rounded-xl">Tengeneza Caption</button><div id="out" class="hidden mt-6 p-4 bg-black rounded-xl border border-zinc-700"></div></div><a href="/" class="block text-center mt-8 text-gray-500">Rudi Home</a></div><script>function gen(){let t=document.getElementById('txt').value;if(!t)return alert('Andika kwanza!');let c=`🔥 ${t} 🔥\n\n#WisemansStudio #GospelMombasa`;document.getElementById('out').innerHTML=`<p style="white-space:pre-wrap">${c}</p><button onclick="navigator.clipboard.writeText(\`${c}\`)" class="mt-3 text-sm bg-zinc-800 px-3 py-2 rounded">Copy</button>`;document.getElementById('out').classList.remove('hidden');}</script></body></html>
