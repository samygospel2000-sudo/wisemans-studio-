<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Tools V2</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:20px;margin:0}
.box{max-width:500px;margin:auto}
.card{background:#1a1a1a;padding:20px;border-radius:16px;border:1px solid #333}
.btn{padding:10px;border-radius:10px;border:1px solid #444;background:#272727;color:#fff}
.btn.active{background:#facc15;color:#000;font-weight:bold}
textarea{width:100%;padding:12px;background:#000;border:1px solid #555;border-radius:12px;color:#fff}
.go{width:100%;margin-top:12px;padding:14px;background:#facc15;color:#000;font-weight:bold;border:none;border-radius:12px}
.out{margin-top:12px;padding:12px;background:#000;border:1px solid #555;border-radius:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h1>AI Tools V2</h1>
<p style="color:#aaa">English + Kiswahili</p>
<div class="card">
<div style="display:flex;gap:8px;margin-bottom:12px">
<button id="bSw" onclick="mode='sw';upd()" class="btn active" style="flex:1">Kiswahili</button>
<button id="bEn" onclick="mode='en';upd()" class="btn" style="flex:1">English → Kiswahili</button>
</div>
<textarea id="txt" rows="3" placeholder="Andika hapa..."></textarea>
<button class="go" onclick="go()">Tengeneza</button>
<div id="st" style="text-align:center;color:#facc15;font-size:12px;margin-top:8px"></div>
<div id="out" class="out" style="display:none"></div>
</div>
<a href="/" style="display:block;text-align:center;margin-top:20px;color:#888">← Rudi Home</a>
</div>
<script>
let mode='sw';
function upd(){
document.getElementById('bSw').className=mode=='sw'?'btn active':'btn';
document.getElementById('bEn').className=mode=='en'?'btn active':'btn';
}
async function go(){
let t=document.getElementById('txt').value.trim();
if(!t){alert('Andika!');return;}
let s=document.getElementById('st'),o=document.getElementById('out');
if(mode=='en'){
s.innerText='Inatafsiri...';
try{
let r=await fetch('api.mymemory.translated.net'+encodeURIComponent(t)+'&langpair=en|sw');
let j=await r.json();
t=j.responseData.translatedText||t;
s.innerText='Imetafsiriwa: '+t;
}catch(e){s.innerText='';}
}
setTimeout(()=>s.innerText='',3000);
o.innerText='🔥 '+t+' 🔥\n\n#WisemansStudio';
o.style.display='block';
}
upd();
</script>
</body>
</html>
